# local-simtalk-execution-eval configuration.
#
# Override any field with --config /path/to/this.yaml
# or via CLI: --host, --port, --iterations, --mock.

# Path to the skill's high-level sender (relative to repo root by default).
# The runner auto-resolves against the eval directory's parent.
simtalk_send_path: skills/local-simtalk-execution/scripts/simtalk_send.py

# TCP target. Default: WSL2 → host via host.docker.internal (lifelines.md §1).
host: host.docker.internal
port: 50007

# Iterations per task. Variance threshold in stats.py uses pass_rate < 0.80.
iterations: 5

# Set to true to use fixture-based mock (no PS required; offline dev only).
# NEVER enable in CI — it skips the real protocol entirely.
mock: false