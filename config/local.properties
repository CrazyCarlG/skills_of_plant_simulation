; ============================================================
;  CoPilot local runtime configuration
;
;  Read by:
;    Copilot-using/start_copilot.bat
;    Copilot-using/stop_copilot.bat
;    Copilot-using/ask_copilot.py
;    skills/local-get-rag-knowledge/scripts/rag_ask.py
;
;  Format: KEY=VALUE, one per line. Lines starting with ';' are comments.
;  Restart the CoPilot service after editing.
;
;  NOTE: this file is parsed by cmd.exe, so keep values ASCII-only.
; ============================================================

; Install dir of the CoPilot runtime shipped with Plant Simulation 2606
COPILOT_DIR=C:\ProgramFiles\Siemens\TecnomatixPlantSimulation2606\Copilot

; Embedded Python interpreter, path relative to COPILOT_DIR
COPILOT_PYTHON=python-3.14.5-embed\pythonw.exe

; Service entry file inside COPILOT_DIR
COPILOT_SERVICE_FILE=copilot_service.py

; uvicorn target (module:attribute)
COPILOT_SERVICE=copilot_service:app

; HTTP listen address and port
COPILOT_HOST=127.0.0.1
COPILOT_PORT=8002

; Log dir (relative to COPILOT_DIR) and log file name
COPILOT_LOG_SUBDIR=logs
COPILOT_LOG_FILE=copilot.log
